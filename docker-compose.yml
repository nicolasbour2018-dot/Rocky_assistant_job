# New Rocky: application, PostgreSQL, test PostgreSQL and the single verification command.
# See docs/decisions/B1-squelette.md. Compose interpolates this whole file: a literal "$" is written "$$".
#
#   docker compose run --rm --build check   # global verification (ruff, mypy, pytest)
#   docker compose up -d --build --wait app # migrations (service migrate), then http://127.0.0.1:8000
#
# Never run `docker compose config`: it prints the values interpolated from the local environment file.

name: rocky

# The root Dockerfile belongs to the old Rocky (read-only until F2): the new image is defined here.
x-dockerfile: &dockerfile |
  FROM python:3.13-slim AS base
  COPY --from=ghcr.io/astral-sh/uv:0.12.18 /uv /bin/uv
  ENV PYTHONDONTWRITEBYTECODE=1 \
      PYTHONUNBUFFERED=1 \
      UV_COMPILE_BYTECODE=1 \
      UV_LINK_MODE=copy \
      UV_PYTHON_DOWNLOADS=never \
      UV_PYTHON_PREFERENCE=only-system \
      UV_PROJECT_ENVIRONMENT=/opt/venv \
      PLAYWRIGHT_BROWSERS_PATH=/opt/playwright \
      PATH=/opt/venv/bin:$$PATH
  WORKDIR /app
  COPY pyproject.toml uv.lock ./

  # PDF rendering (docs/decisions/D2-cv-rendu.md): headless Chromium through Playwright, pdftocairo from poppler.
  FROM base AS runtime
  RUN uv sync --frozen --no-dev --no-install-project \
      && playwright install --with-deps --only-shell chromium \
      && apt-get update && apt-get install -y --no-install-recommends poppler-utils \
      && rm -rf /var/lib/apt/lists/*
  COPY rocky ./rocky
  RUN uv sync --frozen --no-dev --no-editable && useradd --create-home --uid 1000 rocky \
      && mkdir -p /srv/rocky-files && chown rocky:rocky /srv/rocky-files
  USER rocky
  EXPOSE 8000
  CMD ["uvicorn", "--factory", "rocky.system.web:create_app", "--host", "0.0.0.0", "--port", "8000"]

  FROM base AS dev
  RUN uv sync --frozen --no-install-project \
      && playwright install --with-deps --only-shell chromium \
      && apt-get update && apt-get install -y --no-install-recommends poppler-utils \
      && rm -rf /var/lib/apt/lists/*
  ENV PYTHONPATH=/app

# Runtime image and database URL shared by the application and the migrations.
x-app-image: &app-image
  build:
    context: .
    dockerfile_inline: *dockerfile
    target: runtime
  image: rocky-app:dev
  environment:
    ROCKY_DATABASE_URL: postgresql://rocky_app:${ROCKY_DB_APP_PASSWORD:-}@db:5432/rocky
    # Base of the links in account e-mails; https also makes the session cookie Secure.
    ROCKY_PUBLIC_URL: ${ROCKY_PUBLIC_URL:-http://127.0.0.1:8000}
    # Optional: without SMTP, invitations and password resets fail with an explicit message.
    ROCKY_SMTP_HOST: ${ROCKY_SMTP_HOST:-}
    ROCKY_SMTP_PORT: ${ROCKY_SMTP_PORT:-587}
    ROCKY_SMTP_USERNAME: ${ROCKY_SMTP_USERNAME:-}
    ROCKY_SMTP_PASSWORD: ${ROCKY_SMTP_PASSWORD:-}
    ROCKY_SMTP_FROM: ${ROCKY_SMTP_FROM:-}
    ROCKY_SMTP_STARTTLS: ${ROCKY_SMTP_STARTTLS:-true}
    # Job sources (docs/decisions/C1-sources.md): a source without its keys is shown "not configured".
    ROCKY_ADZUNA_APP_ID: ${ROCKY_ADZUNA_APP_ID:-}
    ROCKY_ADZUNA_APP_KEY: ${ROCKY_ADZUNA_APP_KEY:-}
    ROCKY_FRANCE_TRAVAIL_ENABLED: ${ROCKY_FRANCE_TRAVAIL_ENABLED:-false}
    ROCKY_FRANCE_TRAVAIL_CLIENT_ID: ${ROCKY_FRANCE_TRAVAIL_CLIENT_ID:-}
    ROCKY_FRANCE_TRAVAIL_CLIENT_SECRET: ${ROCKY_FRANCE_TRAVAIL_CLIENT_SECRET:-}
    ROCKY_SOURCES_RESULTS_PER_QUERY: ${ROCKY_SOURCES_RESULTS_PER_QUERY:-20}
    # Language models (docs/decisions/G4-assistant.md): a default model, one per call type when both its values are
    # set, a key per provider; without its key, a call is "unavailable". ROCKY_GEMINI_MODEL: former name, still read.
    ROCKY_MODEL_PROVIDER: ${ROCKY_MODEL_PROVIDER:-}
    ROCKY_MODEL_NAME: ${ROCKY_MODEL_NAME:-}
    ROCKY_GEMINI_MODEL: ${ROCKY_GEMINI_MODEL:-}
    ROCKY_ASSISTANT_MODEL_PROVIDER: ${ROCKY_ASSISTANT_MODEL_PROVIDER:-}
    ROCKY_ASSISTANT_MODEL_NAME: ${ROCKY_ASSISTANT_MODEL_NAME:-}
    ROCKY_SUMMARY_MODEL_PROVIDER: ${ROCKY_SUMMARY_MODEL_PROVIDER:-}
    ROCKY_SUMMARY_MODEL_NAME: ${ROCKY_SUMMARY_MODEL_NAME:-}
    ROCKY_CV_MODEL_PROVIDER: ${ROCKY_CV_MODEL_PROVIDER:-}
    ROCKY_CV_MODEL_NAME: ${ROCKY_CV_MODEL_NAME:-}
    ROCKY_TRANSLATION_MODEL_PROVIDER: ${ROCKY_TRANSLATION_MODEL_PROVIDER:-}
    ROCKY_TRANSLATION_MODEL_NAME: ${ROCKY_TRANSLATION_MODEL_NAME:-}
    ROCKY_LETTER_MODEL_PROVIDER: ${ROCKY_LETTER_MODEL_PROVIDER:-}
    ROCKY_LETTER_MODEL_NAME: ${ROCKY_LETTER_MODEL_NAME:-}
    ROCKY_RECRUITER_MESSAGE_MODEL_PROVIDER: ${ROCKY_RECRUITER_MESSAGE_MODEL_PROVIDER:-}
    ROCKY_RECRUITER_MESSAGE_MODEL_NAME: ${ROCKY_RECRUITER_MESSAGE_MODEL_NAME:-}
    ROCKY_MAIL_CLASSIFICATION_MODEL_PROVIDER: ${ROCKY_MAIL_CLASSIFICATION_MODEL_PROVIDER:-}
    ROCKY_MAIL_CLASSIFICATION_MODEL_NAME: ${ROCKY_MAIL_CLASSIFICATION_MODEL_NAME:-}
    ROCKY_GEMINI_API_KEY: ${ROCKY_GEMINI_API_KEY:-}
    ROCKY_ANTHROPIC_API_KEY: ${ROCKY_ANTHROPIC_API_KEY:-}
    ROCKY_OPENAI_API_KEY: ${ROCKY_OPENAI_API_KEY:-}
    ROCKY_MISTRAL_API_KEY: ${ROCKY_MISTRAL_API_KEY:-}
    ROCKY_ASSISTANT_DAY_LIMIT: ${ROCKY_ASSISTANT_DAY_LIMIT:-5}
    ROCKY_LLM_MAIL_HOUR_LIMIT: ${ROCKY_LLM_MAIL_HOUR_LIMIT:-20}
    ROCKY_LLM_MAIL_DAY_LIMIT: ${ROCKY_LLM_MAIL_DAY_LIMIT:-60}
    # Gmail read only (docs/decisions/E1-collecte.md): without these three values, Gmail is "not configured".
    ROCKY_GOOGLE_CLIENT_ID: ${ROCKY_GOOGLE_CLIENT_ID:-}
    ROCKY_GOOGLE_CLIENT_SECRET: ${ROCKY_GOOGLE_CLIENT_SECRET:-}
    ROCKY_SECRET_KEY: ${ROCKY_SECRET_KEY:-}
    # Planner (docs/decisions/C6-veille.md): daily watch at noon (Paris), rescoring, purge. Started by the app only.
    ROCKY_SCHEDULER_ENABLED: ${ROCKY_SCHEDULER_ENABLED:-true}
    # Account files (docs/decisions/D2-cv-rendu.md): photos and CV templates, in the named volume rocky-files.
    ROCKY_STORAGE_ROOT: /srv/rocky-files
    # The Rocky workstation on the user's computer (docs/decisions/D5-revisions-envoi.md): `uv run rocky-poste`.
    # DORMANT since the acceptance of 04/10: the prefilling is off, nothing calls it.
    ROCKY_WORKSTATION_URL: ${ROCKY_WORKSTATION_URL:-http://host.docker.internal:8765}

# Creates the application role: never a superuser, owner of its database.
x-db-init: &db-init
  source: db-init
  target: /docker-entrypoint-initdb.d/10-rocky-app-role.sh
  mode: 0555

x-db-healthcheck: &db-healthcheck
  # TCP, not the socket: the temporary server of the init phase only listens on the socket.
  test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
  interval: 2s
  timeout: 3s
  retries: 30

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: rocky_admin
      POSTGRES_PASSWORD: ${ROCKY_DB_ADMIN_PASSWORD:-}
      POSTGRES_DB: rocky
      ROCKY_DB_APP_PASSWORD: ${ROCKY_DB_APP_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql
    configs:
      - *db-init
    healthcheck: *db-healthcheck

  # Throwaway database for the tests: in memory, durability off, fixed non-secret credentials.
  test-db:
    image: postgres:18
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: rocky_test_admin
      POSTGRES_PASSWORD: rocky_test_admin
      POSTGRES_DB: rocky_test
      ROCKY_DB_APP_PASSWORD: rocky_test
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    configs:
      - *db-init
    healthcheck: *db-healthcheck

  # Brings the schema to the latest migration, then exits; the application waits for its success.
  migrate:
    <<: *app-image
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-image
    volumes:
      - files:/srv/rocky-files
    # Docker Desktop knows this name; on Linux it must be declared (the workstation listens on the host).
    # DORMANT with the prefilling (decision D5, acceptance of 04/10).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  check:
    profiles: [tools]
    build:
      context: .
      dockerfile_inline: *dockerfile
      target: dev
    image: rocky-check:dev
    environment:
      ROCKY_TEST_DATABASE_URL: postgresql://rocky_app:rocky_test@test-db:5432/rocky_test
      RUFF_CACHE_DIR: /cache/ruff
      MYPY_CACHE_DIR: /cache/mypy
      PYTEST_ADDOPTS: -p no:cacheprovider
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./rocky:/app/rocky:ro
      - ./tests:/app/tests:ro
      - check-cache:/cache
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "ruff format --check && ruff check && mypy && pytest -n auto"]

configs:
  db-init:
    content: |
      #!/bin/sh
      set -eu
      : "$${ROCKY_DB_APP_PASSWORD:?ROCKY_DB_APP_PASSWORD is empty (see .env.example)}"
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v app_password="$$ROCKY_DB_APP_PASSWORD" -v db_name="$$POSTGRES_DB" <<'SQL'
      CREATE ROLE rocky_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'app_password';
      ALTER DATABASE :"db_name" OWNER TO rocky_app;
      SQL

volumes:
  db-data:
    name: rocky-db-data
  check-cache:
    name: rocky-check-cache
  files:
    name: rocky-files
