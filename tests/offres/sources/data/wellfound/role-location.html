bel":"Public Stage","tooltip":"Publicly traded company","avatarUrl":null,"rating":null,"data":"public_stage"},"JobListingSearchResult:3122521":{"__typename":"JobListingSearchResult","autoPosted":true,"atsSource":null,"description":"**Qui sommes-nous?**\n\n \n\nArtefact est une nouvelle génération de société spécialisée dans le conseil en Data et en Marketing digital data-driven, dont les 1600 employés répartis sur 23 pays ont pour mission de transformer tous types de data chez nos clients en impact business.\n\nNous offrons une large gamme de solutions data-driven, que nous adaptions aux besoins spécifiques de nos clients, que ce soit des projets IA pour l'automatisation des process internes à chaque étape de leur chaîne de valeur, la création d'expériences consommateurs innovantes et personnalisées, le conseil en stratégie data et marketing digital jusqu'à la gestion du mix-média et plus encore !\n\nLa performance de nos services data repose sur une réelle expertise technologique en Intelligence Artificielle et des compétences métiers acquises auprès de plus de 1000 clients dans le monde, tels que AccorHotels, Orange, Carrefour, Engie, Emirates, Deutsche Telekom, Monoprix… \n\nLa force d'Artefact repose sur un mix unique d'atouts: une connaissance des technologies de pointe en data, des méthodes agiles permettant de délivrer très rapidement les projets et des équipes composées des meilleurs experts dans leurs domaines (business consultants, data analysts, data scientists, ingénieurs data…).\n\n \n\n**Responsabilités principales**\n\n \n\n**Définition de stratégie autour de la Data et de l’IA**\n\n \n\n- Accompagner la transformation data de nos clients C-Levels dans leurs différents domaines d'activité : COMEX, marketing, digital, supply-chain, opérations, customer support, IT, etc.\n- Faire preuvre d’agilité intellectuelle et de rigueur pour piloter des projets à haute valeur stratégique pour nos clients en vous appuyant sur l'expertise et les offres d'Artefact:\n\n  - Stratégie Data et IA\n  - Business case et valorisation (topline, bottomline, CSR, …)\n  - Gouvernance de la donnée \u0026 Operating Model\n  - Cadrage et déploiement de Cas d’usages data et IA\n  - Culture, gestion du changement \u0026 adoption autour de la data et IA\n\n \n\n**Missions :**\n\nLe/La Senior Data Consultant(e)  pilote, avec une large autonomie, des projets complets de bout en bout. Localisé dans des équipes chez le client ou dans nos bureaux, il/elle est supervisé/e par un n+1 (manager, directeur, partner) et il est amené à encadrer les consultants plus juniors.\n\n**Les activités à sa charge comprennent notamment:**\n\n**Le pilotage d’un ou plusieurs streams**\n\n  - Garantir le delivery de la mission\n  - Identifier les points de blocage et proposer des solutions\n  - Assurer la gestion de projet (Prise de note, compte-rendu, documentation, planning…)\n  - Fournir des feedbacks constructifs aux membres plus juniors de l'équipe\n\n**La production des livrables de mission**\n\n  - Produire de manière autonome des présentations (benchmarks, études de cas, workshops decks, sections steerco).\n  - Rédiger des storylines (messages clés, contenu...)\n  - Concevoir et livrer des slides percutantes\n  - Animer les interviews et workshops.\n\n**La conduite de la relation client**\n\n  - Construire une relation de confiance avec les clients\n  - Démontrer de l'assurance dans les situations de networking\n  - Identifier de potentielles opportunités business\n\n**La contribution active au développement d’Artefact**\n\n  - Développer une offre, une Industrie, un chapter ou un partenariat avec votre école\n  - Participer au processus de recrutement par le biais d'entretiens avec les candidats\n  - Animation de différents trainings pour former les nouveaux arrivants.\n\n**Impact Interne**\n\n \n\n- Soutenir le référent référent sur une ou plusieurs expertises et les développer (Stratégie, data governance, data marketing... ) : construction de nouvelles offres, formation des consultants, actions marketing, développement de partenariats, pitchs clients....\n- Assurer la diffusion des connaissances du département Conseil au sein de l'entreprise.\n- Participer à des événements externes et créer du contenu Artefact\n- Devenir une partie intégrante du processus de recrutement, nous aider à recruter les prochains talents, et ensuite coacher et développer les compétences des consultants juniors.\n\n**Profil :**\n\n- Vous avez 2 à 3 ans d'expérience professionnelle dans un cabinet de conseil,\n- Vous avez un profil avec une double casquette ‘business’ et ‘data’ :\n- Vous êtes curieux(se) et passionné(e) par les sujets liés à la data et à l’évolution technologique.\n- Vous avez un état d'esprit analytique et aimez la résolution de problèmes.\n- Vous avez de l'expérience dans la gestion des clients, vous savez comment identifier les opportunités commerciales et vous aimez les interactions.\n- Vous faites preuve de rigueur et proactivité\n- Vous maîtrisez : Suite Google/Pack Office, outils de workshop.\n- Une excellente communication (écrite / orale) en **Français** et en **Anglais** est obligatoire.\n\n**Pourquoi nous rejoindre :**\n\n- Une localisation idéale: nous somme basé en plein cœur de Paris dans le 9ème arrondissement.\n- Un mélange unique de talents (Data consultants, Data Analyst, Data scientist, software engineer), et une hyper croissance continue offrant de nombreuses opportunités de carrières rapides.\n- Un endroit idéal pour apprendre : Vous maîtriserez les compétences clés du monde de l'entreprise de demain : vous recevez des formations régulières sur la technologie (offre Artefact, technologies de la donnée,...), votre travail en équipes hybrides, vous apprenez les façons de travailler spécifiques à la tech (product mindset, agilité...). A la fin de votre expérience Artefact, vous êtes un leader technologique expérimenté.\n- La culture : Innovation, Collaboration et Action sont nos valeurs, pour faire simple, nous sommes des faiseurs qui travaillent ensemble afin de créer des solutions innovantes.\n- Esprit d'entreprise : vous rejoindrez une équipe d'entrepreneurs motivés. Nous n'abandonnerons pas tant que nous n'aurons pas fait un grand pas dans ce secteur !\n\nChez Artefact, nous recrutons nos collaborateurs uniquement en fonction de nos besoins et des qualités propres de chaque candidat. Nous assurons le développement de leurs compétences professionnelles et de leurs responsabilités sans discrimination d’aucune sorte, notamment de croyances, de genre, d’âge, de situation d'handicap, d’origine ethnique, d’orientation sexuelle, d’appartenance à une organisation politique, religieuse, syndicale ou à une minorité. \n\n**Come join us**\n\n \n\n","jobType":"full-time","liveStartAt":1728436517,"locationNames":["Paris"],"primaryRoleTitle":"Other","remote":false,"remoteConfig":null,"acceptedRemoteLocationNames":[],"slug":"senior-data-consultant-paris","title":"Senior Data Consultant - Paris","compensation":"","yearsExperienceMin":null,"yearsExperienceMax":null,"id":"3122521","isBookmarked":false},"JobListingSearchResult:2621031":{"__typename":"JobListingSearchResult","autoPosted":true,"atsSource":null,"description":"Qui sommes-nous?\n\n \n\nArtefact est une nouvelle génération de société spécialisée dans le conseil en Data et en Marketing digital data-driven, dont les 1600 employés répartis sur 23 pays ont pour mission de transformer tous types de data chez nos clients en impact business.\n\nNous offrons une large gamme de solutions data-driven, que nous adaptions aux besoins spécifiques de nos clients, que ce soit des projets IA pour l'automatisation des process internes à chaque étape de leur chaîne de valeur, la création d'expériences consommateurs innovantes et personnalisées, le conseil en stratégie data et marketing digital jusqu'à la gestion du mix-média et plus encore !\n\nLa performance de nos services data repose sur une réelle expertise technologique en Intelligence Ar e":"StartupResult","id":"6860843","badges":[{"__ref":"Badge:COMPANY_STAGE-6860843"}],"companySize":"SIZE_501_1000","highConcept":"Marketing that is well versed in the most advanced technology to create cash flow","highlightedJobListings":[{"__ref":"JobListingSearchResult:3122521"},{"__ref":"JobListingSearchResult:2621031"}],"logoUrl":"https://photos.wellfound.com/startups/i/6860843-69579507d475d2a803f07363fe7bbe72-medium_jpg.jpg?buster=1580889633","name":"Artefact","slug":"artefact-1"},"Badge:ACTIVELY_HIRING":{"__typename":"Badge","id":"ACTIVELY_HIRING","name":"ACTIVELY_HIRING_BADGE","label":"Actively Hiring","tooltip":"Actively processing applications","avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-8677228":{"__typename":"Badge","id":"COMPANY_STAGE-8677228","name":"COMPANY_STAGE_BADGE","label":"Growth Stage","tooltip":"Expanding market presence","avatarUrl":null,"rating":null,"data":"growth_stage"},"Badge:GROWING_FAST-8677228":{"__typename":"Badge","id":"GROWING_FAST-8677228","name":"GROWING_FAST_BADGE","label":"Growing fast","tooltip":"Showed strong hiring growth in the past month","avatarUrl":null,"rating":null,"data":null},"JobListingSearchResult:4505568":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":"AtsIntegration::Ashby::Listing","description":"## **Our Mission**\n\nAt Omnea, we’re reinventing how enterprise businesses operate, starting with the most painful parts: **procurement** – where a single purchase can drag on for months, trigger **50+ emails**, and pull in **Finance, Legal, Security, and IT** just to get something approved.\n\nWe’ve raised **$75M from Khosla Ventures, Insight Partners,** and **Accel** to change that. Our AI-native platform connects every person, step, and system so buying is fast, safe, and efficient – one place to request, automated approvals and renewals, real-time supplier risk, and complete spend visibility.\n\nThe opportunity is massive. **Every enterprise on the planet has this problem and nobody has solved it**. We’ve 10x’d ARR to double-digit millions in 18 months and are trusted by global enterprises like Spotify, MongoDB, Monzo, and Albertsons. We’re now the [**_4th fastest growing startup_**](https://sifted.eu/leaderboards/sifted-future-50-2025) in Europe \u0026 the Sunday Times' #1 Best Medium Sized Tech Company To Work for.\n\n**Our team previously scaled Tessian** (**cybersecurity tech,** backed by Sequoia, Balderton, Accel**,** acquired post-Series C), and our team includes ex-founders operators who’ve grown unicorns, shipped world-class products, and executed at the highest levels. You’ll work alongside leaders like [**_Ben_**](https://www.linkedin.com/in/ben-freeman-a8542166/), [**_Abs_**](https://www.linkedin.com/in/abhirukt/), [**_Sabrina_**](https://www.linkedin.com/in/scastiglione/), and [**_Rebe_**](https://www.linkedin.com/in/rebecatristan/).\n\n## **Find out more about the team and life at Omnea** [**here**](https://www.youtube.com/playlist?list=PLpjeHyocsu3ZoDn3sfODjqIR2L_DW3dgb)**.** \n\n## The Role\n\nAI is changing what it means to deploy enterprise software. Configuring a customer's procurement workflows used to mean weeks of manual setup, integration by integration, edge case by edge case. Increasingly, that first-draft build work can be directed rather than done by hand: AI agents can generate workflow configurations, draft integration mappings, and produce the initial pass on a customer's setup.\n\nThe job shifts with it. Instead of building every workflow yourself, you specify exactly what needs to exist, direct AI to build it, and apply the judgment AI can't: is this the right configuration for this customer's approval policy, will Legal and Finance actually sign off on it, does it hold up once real spend starts flowing through it. In practice, that might mean catching that the approval chain AI just drafted works perfectly for HQ, but misses a regional delegation-of-authority rule that would fail an audit in the customer's APAC entity.\n\nAs Omnea's AI Solutions Lead, you own deployment of the Omnea platform end to end - typically running 3-5 enterprise deployments concurrently - for some of Europe's most recognisable companies. You advise customers on the best-fit configuration, direct AI-assisted build work to get there fast, and validate every output against what the customer actually needs. You'll also deal with the politics that come with every enterprise rollout: the Legal team wanting one more sign-off, the Finance stakeholder who doesn't trust the new approval flow, the exec sponsor who's gone quiet. You become the internal voice of the customer, and you're judged on outcomes you can point to: time to launch, post-go-live CSAT, and whether that customer becomes a case study or reference.\n\nThis is an early hire on Omnea's customer team, working directly with our sales, customer, product, and engineering leadership. The future shape of the role is yours to define!\n\n## What You'll Do\n\n### Discover and design\n\n- Run discovery with customer stakeholders across Procurement, Finance, Legal, and IT, and translate their process into an Omnea configuration\n- Design the target workflow: approval chains, routing logic, integrations, and the edge cases that make procurement hard\n- On a deployment with a dozen-plus integrations, you own the sequencing - what has to land first, what blocks what - and the harder calls underneath it: which system is the source of truth for a given entity, and how records reconcile when two systems key that entity differently\n- Define success criteria and a realistic path to go-live with the customer's project sponsor\n\n### Build with AI, not instead of it\n\n- You're not just directing AI to draft your own deliverables faster - you're configuring the specialized agents Omnea's customers rely on every day: an intake agent that knows how to ask a procurement analyst the right follow-up question, a risk agent that flags what actually matters to this customer's Legal team\n- The real leverage comes from chaining agents together - an intake agent that hands clean, structured requests to a risk agent, which in turn routes into approvals with the right context already attached. You design how those agents work as a system, not just individually\n- Writing a spec for one agent is a skill. Writing one that holds up across a chain of agents - where one agent's output becomes another's input - is the actual bar here\n- Validate every AI-generated output against the customer's actual process, policy, and edge cases before anything ships\n- Handle what AI can't: judgment calls on ambiguous requirements, custom logic, and anything that needs a human read on internal politics\n\n### Deploy and prove value\n\n- Present configured workflows to stakeholders, from procurement analysts to CFOs, working through the pushback and internal politics that come with any enterprise rollout, and win their buy-in\n- Run multi-day onsite workshops with customers, coordinating dozens of stakeholders across multiple workstreams at once - a different muscle than a single stakeholder meeting\n- Project-manage the deployment: timelines, blockers, stakeholder alignment, and a clear path to launch, acting as an extension of the customer's team\n- Track adoption after go-live and keep the configuration working as the customer's process evolves\n- Work with Product and Engineering during the design phase, not just after something breaks in the field - you're often the earliest signal on whether a new module will hold up for an enterprise customer, and that shapes what gets built next\n\n## What's Different About This Role\n\n- You'll spend more time specifying and validating than building from scratch. AI produces the first draft; you make sure it's right for this customer\n- Writing instructions AI can act on precisely is a skill you'll build fast here. Vague requests produce vague configurations\n- Judgment matters more, not less. AI speeds up the build, but you decide whether the output is right for this contract, this Board, this customer\n- You'll keep experimenting as our AI tooling evolves, and share what works with the rest of the team\n\n## About You\n\nWe don't expect you to know how to do all of this on day one. TL;DR: you're ambitious and hard-working, as comfortable directing an AI agent through a tricky configuration as you are presenting a project plan to an exec. You make up for any gap in experience with hunger and a genuine growth mindset. You derive energy from building relationships, shipping projects, and making customers succeed.\n\n- 4-8 years in a fast-paced, high-bar environment: a startup, scale-up, consulting, banking, or something you built yourself\n\n  - Less experience? Check out our [Solutions Associate role](https://jobs.ashbyhq.com/omnea/425759c7-c2d6-4dcd-b04a-3dc27c4a3c10)\n- Comfortable directing AI tools to produce first-draft work, and confident enough in your own judgment to catch what's wrong. Prior use of tools like ChatGPT, Claude, or Cursor is a strong plus. What matters most is your ability to write clear, specific instructions and evaluate what comes back\n- Client-facing experience, or the natural gravitas to be excellent at it. You can point to a time you went well beyond what a client expected\n- A track record of doing something exceptionally well, whether that's work, academia, sport, or anything else you've put your mind to\n- Comfortable reasoning about system architecture - how data models, primary keys, and integration sequencing interact across a dozen enterprise systems. You don't need to write the integration code, but you need to know why it breaks and be able to reason with the people who do, and you'll need to become an Omnea product expert\n- You build real relationships with people at any level, from a junior procurement analyst to a CFO, and know how to handle pushback and stakeholder politics, not just build rapport\n- Comfortable running rooms of stakeholders across a genuinely cross-functional tool - on a single project you'll interface with the CPO, Legal, Finance, AP, InfoSec, and Compliance, plus each of their technical resources, often all with competing priorities on the same decision\n- Comfortable moving between the detail and the big picture: configuring a workflow in the morning, presenting a project plan to an exec in the afternoon\n- Entrepreneurial, have high ownership, and want to be part of building something. We've signed up to the Future Founder Promise\n- An excellent communicator: clear and concise, verbal and written, even when the subject is complicated\n- Highly organised: comfortable running 3-5 enterprise deployments concurrently, each at a different stage, without dropping any of them\n\nAt Omnea, we embrace diversity. To build a product that's loved by everyone, we're best served by a team with all sorts of backgrounds, experiences, and perspectives. We encourage you to apply even if your experience doesn't quite match the full job spec! And regardless of your race, religion, colour, gender, or anything else! If you think you could be a good fit for Omnea, please reach out.\n\n## **A few things to note:** \n\n- We offer competitive geo-localised benefits, and you can check out our [**UK Benefits Package** here](https://www.notion.so/omnea/UK-Benefits-at-Omnea-36c88cce658781c39d08ee947693506f) and our[**US Benefits Package** here](https://www.notion.so/omnea/US-Benefits-at-Omnea-36c88cce658781b49890e725794c0af1).\n- We work Tuesdays, Wednesdays \u0026 Thursdays in-person at our offices. At this early stage of our company life-cycle it's important to us that we get this together-time, and you can read more about why we believe this is a winning move [here](https://www.omnea.co/documents/why-omnea-is-not-fully-remote)\n- We're commercial, ambitious and we don't pretend otherwise! We're actively seeking folks looking to make the most of a career-defining opportunity, with the hunger to be part of building something really **impressive**. You can see our values [here](https://www.omnea.co/careers) and our Omnea Future Founder's fund [here](https://news.crunchbase.com/startups/omnea-funding-employees-future-founders-freeman/)!\n- We sometimes use AI note-takers to help us transcribe interview notes, so we can be more present in your interview. If you'd like to opt out of us using automatic transcribers, please note this in the free text field in your application, otherwise we'll take your application as confirmation that you're happy for us to use notetakers (whether added to video calls or in the background).\n\nWe are proud to be recognised for both our culture and product, and we are just getting started. Join us as we grow!\n\n### Legal note: if you are viewing this posting outside of the Omnea careers' page, this may be an auto-generated advertisement and may lack the full range of advertised information - please click through to the posting at [https://jobs.ashbyhq.com/omnea](https://jobs.ashbyhq.com/omnea) to view additional advertised information on this posting.   \nAdditionally, where roles have hard-specified requirements (e.g. [x] days in office, unable to provide visas, etc), if in your application you provide deterministic check-box confirmation that you do not meet the hard-specified requirements, deterministic (not AI or subjective) automatic rejection criteria are in place.\n","jobType":"full-time","liveStartAt":1788739200,"locationNames":["Paris"],"primaryRoleTitle":"Project Manager","remote":false,"remoteConfig":null,"acceptedRemoteLocationNames":[],"slug":"ai-solutions-lead","title":"AI Solutions Lead","compensation":"$120k – $190k","yearsExperienceMin":null,"yearsExperienceMax":null,"id":"4505568","isBookmarked":false},"StartupResult:8677228":{"__typename":"StartupResult","id":"8677228","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:COMPANY_STAGE-8677228"},{"__ref":"Badge:GROWING_FAST-8677228"}],"companySize":"SIZE_51_200","highConcept":"Omnea is an AI-native platform that streamlines procurement across teams and systems","highlightedJobListings":[{"__ref":"JobListingSearchResult:4505568"}],"logoUrl":"https://photos.wellfound.com/startups/i/8677228-eb060c0b9d4719d3b4a654fc71dccafd-medium_jpg.jpg?buster=1641988615","name":"Omnea","slug":"omnea-1"},"Badge:B2B-6841487":{"__typename":"Badge","id":"B2B-6841487","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-6841487":{"__typename":"Badge","id":"COMPANY_STAGE-6841487","name":"COMPANY_STAGE_BADGE","label":"Growth Stage","tooltip":"Expanding market presence","avatarUrl":null,"rating":null,"data":"growth_stage"},"JobListingSearchResult:4356292":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":"AtsIntegration::Greenhouse::Listing","description":"**⭐ About the team:**\n\n\n\nDataDome delivers real-time bot and agent trust management, giving businesses complete visibility and control over all traffic—human, bot, or AI. Named a Leader in The Forrester Wave™ for Bot And Agent Trust Management Q2 2026, DataDome is trusted by enterprises like Etsy, PayPal, and Soundcloud. Acting as a traffic control plane, DataDome's multi-layered AI engine leverages thousands of models and 5 trillion signals daily to analyze intent and stop fraud in under 2 milliseconds—letting legitimate users through seamlessly across websites, apps, APIs, and MCPs. Backed by a 24/7 SOC and expert threat researchers, DataDome stops 20k+ attacks every second. With 30+ global PoPs, and 80+ ready-made integrations, DataDome is a recognized Leader on G2 across several categories—delivering protection that outperforms.\n\n**You will be more specifically in charge of:**\n\n- Providing (tier 2 and 3) support to our customers, be part of our threat research team, collaborate with threat researches and data scientists to challenge our detection engine on a daily basis\n- Analyzing huge web traffic data sets (across more than 100 billions documents) to identify and block malicious traffic\n- Contributing to support by analyzing past attacks to strenghten our detection!\n- Collaborate with threat researchers to challenge and optimize DataDome real-time detection engine capabilities\n- Creating automates/scripts to detect outliers in our global traffic\n- Identifying potential attacks and add new alerts to our detection platform\n\n👤 **What we look for:**\n\n- Bachelors Degree Required in a relevant field\n- At least 2 years in similar experience\n- Familiar with at least one scripting language (preferably Python) to automate analysis and detection tasks\n- **Have a real passion for data, security and automated attacks mitigation**\n- Have expertise on network or web infrastructure (HTML, HTTP, CDN, DNS, IPv4/IPv6, cookies)\n- Master at least one DataBase language: MySQL/NoSQL/ElasticSearch\n\n**Bonus points**\n\n \n\n- You implement bots during your spare time\n- You have already used Kibana\n\n \n\n**What’s in it for you?**\n- **Flex Life:** While we offer remote, each position specifies the level of flexibility. You will also receive a 500€ stipend to help you set up your ideal workspace if you work hybrid or remotely.\n- **Generous Health Benefits:** We have partnered with Kenko for your healthcare needs.\n- **Professional Development**: #Weaimhigh is part of our DNA, therefore we have invested in an internal Learning and Development platform and offer the opportunity to request additional training and support via your manager.\n- **Events \u0026 Team building: #We care and we have fun!** We organise ****Annual Company-Offsite, Events, Drinks, Winter Party, Lunch \u0026 Learns and much more are part of our Culture\n- **Parent Care:** Gift \u0026 care packages for parents.\n- **PTO:** Based on the country you are based from (e.g. 20 days in Costa Rica/5 days sick leave).\n\n \n\n**What are the next steps?**\n\nYou x Talent Acquisition Manager : first interview and cultural fit\n\nYou x Engineering Manager : technical and cultural fit + Take-home technical challenge\n\nYou x Team: Presentation and review of your \"technical proposal\" with the team\n\nYou x Member of the leadership team - Discussion about DataDome vision and \"raison d'être\" ?\n\nNow you really met everyone Welcome to DataDome :)\n\nDataDome is an equal opportunity employer, and proud to be committed to diversity and inclusiveness. We will consider all qualified applicant without regard to race, color, nationality, gender, gender identity or expression, sexual orientation, religion, disability or age.\n\n \n\n","jobType":"full-time","liveStartAt":1781730452,"locationNames":["New York City","Singapore","Paris"],"primaryRoleTitle":"Data Analyst","remote":false,"remoteConfig":null,"acceptedRemoteLocationNames":["Costa Rica"],"slug":"cyber-security-analyst-wed-sun","title":"Cyber Security Analyst (Wed-Sun)","compensation":"$40k – $50k","yearsExperienceMin":null,"yearsExperienceMax":null,"id":"4356292","isBookmarked":false},"StartupResult:6841487":{"__typename":"StartupResult","id":"6841487","badges":[{"__ref":"Badge:B2B-6841487"},{"__ref":"Badge:COMPANY_STAGE-6841487"}],"companySize":"SIZE_51_200","highConcept":"To free the web from fraudulent traffic ","highlightedJobListings":[{"__ref":"JobListingSearchResult:4356292"}],"logoUrl":"https://photos.wellfound.com/startups/i/6841487-3e9a0b9ce89456d3cd573d391d5293d2-medium_jpg.jpg?buster=1754911836","name":"DataDome","slug":"datadome-2"},"Badge:TOP_RESPONDER-11101087":{"__typename":"Badge","id":"TOP_RESPONDER-11101087","name":"TOP_RESPONDER_BADGE","label":"Top 5% of responders","tooltip":"PeakTew is in the top 5% of companies in terms of response time to applications","avatarUrl":null,"rating":null,"data":null},"Badge:QUICK_RESPONDER-11101087":{"__typename":"Badge","id":"QUICK_RESPONDER-11101087","name":"QUICK_RESPONDER_BADGE","label":"Responds within a few days","tooltip":"Based on past data, PeakTew usually responds to incoming applications within a few days","avatarUrl":null,"rating":null,"data":null},"Badge:GROWING_FAST-11101087":{"__typename":"Badge","id":"GROWING_FAST-11101087","name":"GROWING_FAST_BADGE","label":"Growing fast","tooltip":"Showed strong hiring growth in the past month","avatarUrl":null,"rating":null,"data":null},"JobListingSearchResult:4572853":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"PeakTew is a social media app aiming to connect more people with the real world. Our team consists of passionate individuals from over a dozen different countries. This offer is aimed at those willing to **take part in a startup project in their free time** to learn more about the professional world and gain international work experience. This implies being ready to **commit some time every week** to the project. This is an online role, meaning that you would be **working remotely**.\n\nWe are currently looking for a motivated **Business Analyst** to contribute to the growth and development of the start-up, supporting strategic decision-making through business analysis, research, and data-driven insights.\n\n**Your missions:**\n- Develop and analyze business plans, market frameworks, and strategic recommendations.\n- Perform micro-level analysis (e.g., SWOT) and macro-level analysis (e.g., PESTEL).\n- Prepare market reports, summarizing key trends, competitor performance, and industry evolution.\n- Understand and anticipate market trends to guide business strategies.\n- Conduct benchmarking to assess competitive advantages and positioning.\n- Conduct field research, including interviews, questionnaires, and focus groups.\n- Attend the weekly team meetings to debrief your work.\n\n**Regarding compensation:** This is currently an **unpaid** opportunity as PeakTew is a student-led startup project that is not yet generating revenue. This role is mainly suited for students or individuals looking to gain international experience, practical skills, and exposure to working in a startup environment.\n\n**This opportunity will enable you to:**\n- Gain hands-on international work experience. \n- Develop professionally within a startup environment.\n- Expand your global network, primarily in Europe, North America, and Asia-Pacific.\n- Receive high-quality mentorship (hard/soft skills).\n- Obtain the opportunity to become a permanent employee in a future Unicorn Company.\n\n**Competencies required:**\n- Convenient English level (PeakTew operates in English).\n- Be a business student or of a similar academic background, with the required skills.\n- Strong analytical skills and strategic thinking.\n- Ability to interpret data and create actionable insights.\n- Autonomous mindset (ability to have excellent communication and teamwork).\n- Quick learner \u0026amp; Outside-of-the-box thinker.\n\n**Application process:**\n- Introductory screening interview\n- Interview with our CEO to learn about our core values\n- Q-and-A session to get to know you better\n- Panel interview, where you can meet the team!","jobType":"internship","liveStartAt":1789808419,"locationNames":["London","Toronto","Paris","Sydney","Singapore"],"primaryRoleTitle":"Business Analyst","remote":true,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"REMOTE","wfhFlexible":false},"acceptedRemoteLocationNames":[],"slug":"business-strategist","title":"Business Strategist","compensation":"No equity","yearsExperienceMin":0,"yearsExperienceMax":null,"id":"4572853","isBookmarked":false},"StartupResult:11101087":{"__typename":"StartupResult","id":"11101087","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:TOP_RESPONDER-11101087"},{"__ref":"Badge:QUICK_RESPONDER-11101087"},{"__ref":"Badge:GROWING_FAST-11101087"}],"companySize":"SIZE_11_50","highConcept":"Connecting people in real life","highlightedJobListings":[{"__ref":"JobListingSearchResult:4572853"}],"logoUrl":"https://photos.wellfound.com/startups/i/11101087-1d926e98511a3c5cb9cb2d0826908e86-medium_jpg.jpg?buster=1783733135","name":"PeakTew","slug":"peaktew-1"},"Badge:QUICK_RESPONDER-9745875":{"__typename":"Badge","id":"QUICK_RESPONDER-9745875","name":"QUICK_RESPONDER_BADGE","label":"Responds within three weeks","tooltip":"Based on past data, Marble usually responds to incoming applications within three weeks","avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-9745875":{"__typename":"Badge","id":"COMPANY_STAGE-9745875","name":"COMPANY_STAGE_BADGE","label":"Early Stage","tooltip":"Startup in initial stages","avatarUrl":null,"rating":null,"data":"early_stage"},"Badge:GROWING_FAST-9745875":{"__typename":"Badge","id":"GROWING_FAST-9745875","name":"GROWING_FAST_BADGE","label":"Growing fast","tooltip":"Showed strong hiring growth in the past month","avatarUrl":null,"rating":null,"data":null},"JobListingSearchResult:4688448":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":"AtsIntegration::Ashby::Listing","description":"## **About Marble**\n\n[*Marble*](https://marble.studio) *is a climate tech venture studio. We partner with scientists, engineers, and operators to create companies solving hard climate problems in the world's largest industries.*\n\n*Our first* [***15 companies***](https://marble.studio/companies) *are building transformative products across energy, industry, agriculture, and climate resilience. 100% have been successful in raising follow-on to date. We are looking to partner with exceptional individuals to create our next venture.*\n\n## About The Role\n\nWe are hiring a Junior Venture Analyst intern to join the Marble team and support the market and commercial exploration of key opportunity areas in climate tech.\n\nYou will work directly with Partners, senior team members, and brilliant founders on a mission to turn the tide on the climate crisis. This role offers a unique opportunity to work with some of the brightest and most mission driven individuals you’ll meet!\n\nYou will be immersed into the worlds of climate and deep tech venture creation. Expect direct exposure to the many aspects of running a climate tech studio: developing new opportunity theses, supporting founders on strategy and fundraising, running customer reserach, and forming a view on which companies are worth building.\n\nThis internship is a great fit for a student with a passion for climate tech and venture, with prior exposure in fast-paced environment where they had to own work, navigate ambiguity, and help shape key decisions (e.g. startups, scaleups, VC, corporate dev, consulting, etc.)\n\n**Location:** HQ in Paris, Station F\n\n**Language:** English fluency required. French fluency preferred.\n\n**Period:** 6-month internship starting as soon as possible\n\n## **Responsibilities**\n\n**Founder \u0026 company-building support.** You'll partner with our Founders in Residence as they turn a technical idea into a real business. That starts with validating their assumptions through market research — forecasts, policy drivers, competition maps, key insights — and goes further into helping them shape business-model options, go-to-market and expansion strategy, roadmap, and fundraising plans. This is effectively strategic consulting: you have a direct say in how an innovation becomes a company, and you diligence each opportunity with full objectivity — do you genuinely believe this will be a fund-returner for Marble?\n\n**Opportunity \u0026 thesis research.** You'll work alongside the venture team as they develop new theses and decide where Marble should build next. Your job is to bring the business lens to that work — sizing markets, mapping the competitive landscape and market structure, identifying the real gaps, and pressure-testing whether an opportunity is genuinely venture-scale. You are the commercial and investor eye in the room.\n\n**Fundraising Operations.** Support Partners on fundraising for our second startup studio vintage, as well as potential new vehicles. This includes: investor research (e.g. HNWIs, Family Offices, Fund of Fund, other LPs), data room material preparation, CRM updates, meeting scheduling and follow-ups, etc.\n\n**Customer development.** You'll help run our structured outreach to connect with leading experts and gather insight through interviews, and you'll build out the customer pipeline as we push to \"sell\" the vision as far as it will go.\n\n**Portfolio \u0026 studio support.** On an ad-hoc basis you'll support portfolio companies after spin-out, with, for instance, their first external fundraise post-Marble. You will also contribute to the studio operations that shape how Marble builds going forward, by notably drafting guides and templates used by founders regarding their commercial and financial deliverables while in program.\n\nAcross all of them, you'll turn your work into clear deliverables — memos, decks, and spreadsheet models (including light financial modeling such as cap tables and projections) — that feed directly into real decisions.\n\n## **Requirements**\n\nThis internship is a unique opportunity for a entrepreneurial individual who’s excited to operate in a fast-paced, high-context environment\n\n- You are studying for a Master’s degree at a top engineering, business school, or university\n- You already had exposure (e.g. internship, school project, etc) to startups, strategy consulting, VC or corporate development.\n- You are fluent / native in English, and ideally in French as well.\n\nYour ability to learn on the job is more important than ticking every single box. However we would especially love to hear from you if:\n\n- You’re passionate about climate tech, startups, industry, energy, venture creation. You are familiar with the key trends and relevant ecosystems.\n- You’re organized, responsive, and can manage many moving parts without dropping the ball.\n- You’re a strong communicator and take pride in creating clean, structured deliverables.\n- You’ve done basic financial modeling and are comfortable working with cap tables and business plans.\n- You are comfortable taking ownership of complex tasks with a \"learning by doing\" attitude.\n- You excel at using modern software and AI products to increase your work leverage, such as Claude, Gemini, Notion, Slack, Airtable, Google Suite, etc. Familiarity with CRMs and specialist AI tools (e.g. Lemlist, Exa, Clay, etc) is a welcome plus.\n\n## **What We Offer**\n\n- €1,600 monthly internship stipend\n- Office located at **Station F in Paris.** Flexible remote days are possible\n- 5 days off\n- Meal vouchers (Swile), 50% transport refund\n- Exposure to our network of top founders, investors, and advisors\n- High ownership, rapid learning curve, and meaningful scope\n- A chance to help build the next generation of Marble companies\n\n*We believe that a diverse group of minds is key to solving the climate crisis. We encourage women and people of colour to apply. Studies have shown that under-represented candidates are less likely to apply for an opportunity unless they feel they meet every single qualification. We are committed to building a diverse, inclusive and mission-driven cohort. If you’re excited about the programme but your past experience doesn’t align perfectly with what you read on our website, we encourage you to apply anyways!*\n\n","jobType":"internship","liveStartAt":1788781941,"locationNames":["Paris"],"primaryRoleTitle":"Business Analyst","remote":false,"remoteConfig":null,"acceptedRemoteLocationNames":[],"slug":"internship-junior-venture-analyst","title":"Internship - Junior Venture Analyst","compensation":"€0k – €1k","yearsExperienceMin":null,"yearsExperienceMax":null,"id":"4688448","isBookmarked":false},"StartupResult:9745875":{"__typename":"StartupResult","id":"9745875","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:QUICK_RESPONDER-9745875"},{"__ref":"Badge:COMPANY_STAGE-9745875"},{"__ref":"Badge:GROWING_FAST-9745875"}],"companySize":"SIZE_11_50",
