[project]
name = "rocky-job-assistant"
version = "0.1.0"
description = "Assistant personnel et modulaire de recherche d'emploi"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "PERF", "PIE", "RET", "RUF", "SIM", "UP"]
# Les apostrophes et guillemets typographiques francais sont la convention du
# projet : docstrings, textes d'interface et valeurs de statut sont en francais.
ignore = ["RUF001", "RUF002", "RUF003"]

# Le formateur vise 88 ; E501 ne signale que ce qu'il ne sait pas decouper,
# c'est-a-dire le contenu des chaines et des commentaires.
[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# Ces modules inserent la racine du projet dans sys.path avant d'importer
# dashboard.* : les imports internes ne peuvent pas remonter en tete de fichier.
"scripts/*.py" = ["E402"]
"dashboard/dashboard_common.py" = ["E402"]
