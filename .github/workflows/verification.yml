# Global verification of the new Rocky, identical to the local command (AGENTS.md, section 8).
# Everything (PostgreSQL test database, roles, locked versions) comes from docker-compose.yml and uv.lock:
# no second definition to keep in sync, and no secret needed.
name: Verification

on:
  push:
    branches: [refonte, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff, mypy, pytest
    # Pinned (decision G1): ubuntu-latest moves to Ubuntu 26 from 19 October 2026; a change of runner is a step of
    # its own, not a surprise (plan v2, section 8, B2).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: docker compose run --rm --build check
        run: docker compose run --rm --build check
