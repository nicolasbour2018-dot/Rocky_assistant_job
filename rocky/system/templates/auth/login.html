{% extends "auth_layout.html" %}
{% block title %}Connexion · Rocky{% endblock %}
{% block content %}
<h1>Connexion</h1>
<form method="post" action="/connexion" class="stack">
  <input type="hidden" name="suite" value="{{ suite }}">
  <label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
  <label for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" class="btn btn-primary">Se connecter</button>
</form>
<p class="muted"><a href="/mot-de-passe-oublie">Mot de passe oublié ?</a></p>
{% endblock %}
