{% extends "auth_layout.html" %}
{% block title %}Mot de passe oublié · Rocky{% endblock %}
{% block content %}
<h1>Mot de passe oublié</h1>
<form method="post" action="/mot-de-passe-oublie" class="stack">
  <label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <button type="submit" class="btn btn-primary">Recevoir un lien</button>
</form>
<p class="muted"><a href="/connexion">Retour à la connexion</a></p>
{% endblock %}
