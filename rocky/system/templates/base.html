<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rocky{% endblock %}</title>
</head>
<body>
  <main>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    {% if info %}<p role="status">{{ info }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
