{% set context = "fiche" %}
<article class="sheet-card">

    hx-swap="innerHTML" aria-label="Fermer la fiche">✕</button>
  {% include "offres/offer_body.html" %}

<div id="dossier" class="sheet-dossier" hx-get="/candidatures/offre/{{ card.id }}" hx-trigger="load"
  hx-swap="innerHTML"></div>
